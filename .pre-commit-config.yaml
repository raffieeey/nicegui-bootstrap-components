# pre-commit: format, lint, and the generation-trace grep
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-generation-traces
        name: no generation traces (tool names, watermarks, AI config files)
        entry: python3 scripts/check_no_traces.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]